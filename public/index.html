<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몽실이 공부코치</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky mascot header + tab bar, one centered column of working panels (max 760px) */
:root{
  --bg:#F3F6FF; --surface:#FFFFFF; --surface-2:#EAF0FF; --ink:#272A40; --ink-soft:#5E6383; --line:#D9E0F5;
  --accent:#F27C4A; --accent-ink:#FFFFFF; --accent-soft:#FFE6D9; --mint:#2FA88A; --mint-soft:#D8F3EA;
  --warn:#E0A100; --danger:#D9534F;
  --fur:#F7B27A; --cream:#FFF4E6; --blush:#FF9DA7; --hm-line:#7A4A2A;
  --s-kor:#E8738A; --s-eng:#5B8DEF; --s-math:#F2994A; --s-sci:#2FA88A; --s-soc:#9B6BDA; --s-his:#B08A5A; --s-etc:#8A93B0;
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171A28; --surface:#22263A; --surface-2:#2B3050; --ink:#ECEEF9; --ink-soft:#A7ACC8; --line:#363C5C;
  --accent:#FF946A; --accent-ink:#1E1410; --accent-soft:#4A2E22; --mint:#4CCAA8; --mint-soft:#1F3E38;
  --fur:#F4A86C; --cream:#FFEBD4; --blush:#FF8F9B; --hm-line:#5A3218; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171A28; --surface:#22263A; --surface-2:#2B3050; --ink:#ECEEF9; --ink-soft:#A7ACC8; --line:#363C5C;
  --accent:#FF946A; --accent-ink:#1E1410; --accent-soft:#4A2E22; --mint:#4CCAA8; --mint-soft:#1F3E38;
  --fur:#F4A86C; --cream:#FFEBD4; --blush:#FF8F9B; --hm-line:#5A3218; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-block:12px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem} h3{font-size:1.12rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.muted{color:var(--ink-soft)}
.small{font-size:.86rem}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.hello{display:flex;gap:12px;align-items:center}
.hello .mascot{width:76px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{font-family:var(--f-display);font-weight:400;font-size:1.08rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.84rem;font-weight:500}
.chip.fire{background:var(--accent-soft);color:var(--ink)}
.chip.pt{background:var(--mint-soft)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.92rem;color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--danger);color:#fff;font-size:.72rem;line-height:18px;text-align:center}

/* panels */
.panel{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.mint{background:var(--mint);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:.85rem;border-radius:10px}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:.9rem}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.9rem}
.subj{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.subj i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ex{font-size:.72rem;font-weight:700;color:var(--ink-soft);border:1.5px dashed var(--line);border-radius:6px;padding:0 6px}

/* home */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--ink-soft)}
@media (max-width:480px){.cards{grid-template-columns:1fr 1fr}.cards .stat:last-child{grid-column:span 2}}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.quick button b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}

/* tasks */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .d{font-family:var(--f-display);font-size:1.15rem;flex:1;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;text-align:center;font-size:.78rem;display:flex;flex-direction:column;gap:2px}
.wd[aria-current="date"]{border-color:var(--accent)}
.wd .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:2px 6px 0}
.wd .bar span{display:block;height:100%;background:var(--mint)}
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg)}
.item.done .t{text-decoration:line-through;color:var(--ink-soft)}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.check{width:26px;height:26px;border-radius:8px;border:2.5px solid var(--mint);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--mint)}
.check svg{width:15px;height:15px}
.x{border:0;background:transparent;color:var(--ink-soft);font-size:1.1rem;padding:2px 6px;border-radius:8px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;text-align:center;color:var(--ink-soft)}
.empty .mascot{width:70px}

/* timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:min(240px,70vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .time{font-family:var(--f-display);font-size:3rem;line-height:1}
.ring .mascot{width:62px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:6px 12px;font-weight:700;font-size:.88rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pips{display:flex;gap:6px}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.pips i.on{background:var(--accent)}

/* coach */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:1rem}
.mode span{font-size:.78rem;color:var(--ink-soft);line-height:1.4}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto;padding:4px 2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .mascot{width:40px;flex:none}
.msg .b{padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.coach .b{background:var(--surface-2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end}
.msg.me .b{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.sys{align-self:center;max-width:100%}
.msg.sys .b{background:transparent;color:var(--ink-soft);font-size:.82rem;padding:2px 8px;border:1.5px dashed var(--line)}
.hintbar{display:flex;gap:4px;align-items:center}
.hintbar i{width:22px;height:6px;border-radius:3px;background:var(--line);display:block}
.hintbar i.on{background:var(--warn)}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.thumb{max-width:160px;border-radius:10px;border:2px solid var(--line)}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{min-height:46px;height:46px;flex:1}

/* review */
.mcard{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mcard .q{white-space:pre-wrap;overflow-wrap:anywhere}
.stage{display:flex;gap:3px}
.stage i{width:16px;height:6px;border-radius:3px;background:var(--line);display:block}
.stage i.on{background:var(--mint)}
.keybox{font-family:ui-monospace,Consolas,monospace;font-size:1rem;background:var(--surface-2);border-radius:10px;padding:6px 10px;letter-spacing:.04em;user-select:all;overflow-wrap:anywhere}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.photo-box{display:flex;flex-direction:column;gap:10px;padding:12px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.mphoto{display:block;max-width:100%;max-height:140px;width:auto;border-radius:10px;border:2px solid var(--line);cursor:zoom-in;object-fit:contain;background:#fff}
.mphoto.big{max-height:70vh;cursor:zoom-out}
details summary{cursor:pointer;font-weight:700;color:var(--ink-soft);font-size:.88rem}
details .ans{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border-radius:10px;padding:8px 10px}

/* stats */
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:300px;height:auto}
.hbar{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center;font-size:.88rem}
.hbar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .track span{display:block;height:100%;border-radius:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.badge .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem;flex:none;background:var(--surface-2);color:var(--ink-soft)}
.badge.got .ic{background:var(--accent);color:var(--accent-ink)}
.badge:not(.got){opacity:.6}
.badge b{display:block;font-size:.9rem}
.badge span{font-size:.75rem;color:var(--ink-soft);line-height:1.3;display:block}

/* 3D study island */
:root{--sky-top:#BFE3FF;--sky-bot:#EAF6FF;--sea:#7CC7F2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky-top:#1C2550;--sky-bot:#2E3A6E;--sea:#2C5C8F}}
:root[data-theme="dark"]{--sky-top:#1C2550;--sky-bot:#2E3A6E;--sea:#2C5C8F}
/* Layout: the whole app is a full-screen 3D island; HUD on top, hotbar at bottom, features open as game windows */
html,body{height:100%;overflow:hidden}
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));touch-action:none;user-select:none}
.hud{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hud > *{pointer-events:auto}
.hud-me{display:flex;gap:6px;align-items:flex-start;max-width:min(420px,60vw)}
.hud-me .mascot{width:54px;flex:none}
.hud .bubble{padding:7px 12px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.hud .bubble::before{top:16px}
.hud-stats{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.lv{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-weight:700;font-size:.84rem;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.lv b{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 10px;font-family:var(--f-display);font-weight:400;font-size:1rem}
.xp{width:84px;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:block}
.xp span{display:block;height:100%;width:0;background:var(--mint);transition:width .5s}
.hud-stats .chip{border:2px solid var(--line);background:var(--surface)}
.hotbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:4px;padding:5px;background:var(--surface);border:2px solid var(--line);border-radius:18px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hotbar::-webkit-scrollbar{display:none}
.hotbar .tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;border-radius:13px;padding:6px 8px;font-size:.72rem;min-width:66px;color:var(--ink-soft)}
.hotbar .tab svg{width:24px;height:24px}
.hotbar .tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.hotbar .tab .dot{position:absolute;top:2px;right:6px;margin:0}
.layer{position:fixed;z-index:5}
.layer.quest{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(330px,calc(100% - 24px));max-height:calc(100% - 210px);overflow-y:auto}
.layer.quest .panel{padding:12px;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.qhead{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left}
.qhead h3{flex:1}
.layer.win{z-index:8;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));background:rgba(18,22,44,.38);backdrop-filter:blur(3px)}
.gwin{width:min(780px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--bg);border:3px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.gwin-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--accent);color:var(--accent-ink)}
.gwin-bar h2{flex:1;font-size:1.3rem}
.gwin-bar button{border:0;background:rgba(255,255,255,.28);color:inherit;border-radius:10px;padding:6px 12px;font-weight:700}
.gwin-body{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
@media (prefers-reduced-motion:no-preference){.gwin{animation:pop .22s ease-out}@keyframes pop{from{transform:scale(.95) translateY(8px);opacity:.5}to{transform:none;opacity:1}}}
.float-xp{position:fixed;z-index:7;font-family:var(--f-display);font-size:1.5rem;color:var(--accent);-webkit-text-stroke:1px var(--surface);pointer-events:none;transform:translate(-50%,-100%)}
@media (prefers-reduced-motion:no-preference){.float-xp{animation:fx 1.3s ease-out forwards}@keyframes fx{to{transform:translate(-50%,-260%);opacity:0}}}
@media (max-width:600px){
  .hud-me .bubble p{display:none}
  .hud-me{max-width:none;flex:1;min-width:0}
  .hud-me .bubble b{font-size:.92rem}
  .hud-me .mascot{width:44px}
  .xp{width:56px}
  .hud-stats .chip.small{display:none}
  .hotbar .tab{min-width:54px;padding:5px 5px;font-size:.66rem}
  .layer.quest{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
  .whud .tip{display:none}
}
.world canvas{display:block;width:100%;height:100%;cursor:pointer}
.wlabel{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-family:var(--f-display);font-size:.92rem;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.wlabel .dot{display:inline-block;min-width:18px;margin-left:4px;border-radius:9px;background:var(--danger);color:#fff;font-size:.72rem;line-height:18px;text-align:center;font-family:var(--f-body);font-weight:700}
.wlabel.near{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.whud{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:50%}
@media (max-width:600px){.whud{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
.whud .tip{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:.8rem;color:var(--ink-soft);max-width:70%}
.whud .enter{pointer-events:auto}
.wload{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.foot{text-align:center;font-size:.78rem;color:var(--ink-soft)}
/* mascot svg parts */
.hm-fur{fill:var(--fur);stroke:var(--hm-line);stroke-width:2.5}
.hm-cream{fill:var(--cream)}
.hm-ear{fill:var(--blush);opacity:.75}
.hm-cheek{fill:var(--blush);opacity:.7}
.hm-ink{fill:var(--hm-line)}
.hm-stroke{fill:none;stroke:var(--hm-line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hm-white{fill:#fff}
.hm-band{fill:var(--mint)}
.hm-tear{fill:#8EC8FF}
.hm-spark{fill:var(--warn)}
@media (prefers-reduced-motion:no-preference){
  .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
"use strict";
/* ---------- basics ---------- */
const SUBJ = [
  {k:"kor",n:"국어"},{k:"eng",n:"영어"},{k:"math",n:"수학"},{k:"sci",n:"과학"},
  {k:"soc",n:"사회"},{k:"his",n:"역사"},{k:"etc",n:"기타"}];
const subjName = k => (SUBJ.find(s=>s.k===k)||SUBJ[6]).n;
const subjColor = k => `var(--s-${SUBJ.some(s=>s.k===k)?k:"etc"})`;
const pad = n => String(n).padStart(2,"0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const addDays = (key,n) => { const [y,m,d]=key.split("-").map(Number); const t=new Date(y,m-1,d); t.setDate(t.getDate()+n); return dkey(t); };
const WK = ["일","월","화","수","목","금","토"];
const dLabel = key => { const [y,m,d]=key.split("-").map(Number); const t=new Date(y,m-1,d); return `${m}월 ${d}일 (${WK[t.getDay()]})`; };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="html") e.innerHTML=v; // only used with trusted, static strings
    else e.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function subjChip(k){ return h("span",{class:"subj"}, h("i",{style:`background:${subjColor(k)}`}), subjName(k)); }
function subjSelect(id, val){
  const s=h("select",{id,"aria-label":"과목"});
  SUBJ.forEach(x=>s.append(h("option",{value:x.k, selected:x.k===val}, x.n)));
  return s;
}

/* ---------- mascot (original hamster) ---------- */
function hamster(mood="normal"){
  const eyes = {
    happy:`<path class="hm-stroke" d="M37 63q6-8 12 0"/><path class="hm-stroke" d="M71 63q6-8 12 0"/>`,
    normal:`<circle class="hm-ink" cx="43" cy="62" r="4.6"/><circle class="hm-ink" cx="77" cy="62" r="4.6"/><circle class="hm-white" cx="44.6" cy="60.4" r="1.6"/><circle class="hm-white" cx="78.6" cy="60.4" r="1.6"/>`,
    focus:`<path class="hm-stroke" d="M36 57l12 3"/><path class="hm-stroke" d="M84 57l-12 3"/><circle class="hm-ink" cx="43" cy="65" r="4.2"/><circle class="hm-ink" cx="77" cy="65" r="4.2"/>`,
    sad:`<path class="hm-stroke" d="M36 56l11-3"/><path class="hm-stroke" d="M84 56l-11-3"/><circle class="hm-ink" cx="43" cy="64" r="4.2"/><circle class="hm-ink" cx="77" cy="64" r="4.2"/>`,
    think:`<circle class="hm-ink" cx="45" cy="59" r="4.4"/><circle class="hm-ink" cx="79" cy="59" r="4.4"/><circle class="hm-white" cx="46" cy="57.5" r="1.5"/><circle class="hm-white" cx="80" cy="57.5" r="1.5"/>`
  };
  const mouth = {
    happy:`<path class="hm-stroke" d="M53 74q3.5 6 7 0q3.5 6 7 0"/>`,
    normal:`<path class="hm-stroke" d="M54 75q3 4 6 0q3 4 6 0"/>`,
    focus:`<path class="hm-stroke" d="M55 76h10"/>`,
    sad:`<path class="hm-stroke" d="M54 79q6-5 12 0"/>`,
    think:`<circle class="hm-stroke" cx="60" cy="77" r="2.6"/>`
  };
  const extra = {
    happy:`<path class="hm-spark" d="M104 22l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><path class="hm-spark" d="M14 34l1.6 3.8 3.8 1.6-3.8 1.6-1.6 3.8-1.6-3.8-3.8-1.6 3.8-1.6z"/>`,
    focus:`<path class="hm-band" d="M19 47q41-14 82 0v8q-41-14-82 0z"/><path class="hm-band" d="M99 49l12-6-3 10 9 4-14 1z"/>`,
    sad:`<path class="hm-tear" d="M84 70q4 6 0 9q-4-3 0-9z"/>`,
    think:`<text x="98" y="30" font-family="Jua, sans-serif" font-size="24" fill="var(--accent)">?</text>`,
    normal:``
  };
  const m = eyes[mood]?mood:"normal";
  return `<svg viewBox="0 0 120 110" role="img" aria-label="햄스터 코치 몽실이"><circle class="hm-fur" cx="31" cy="30" r="13"/><circle class="hm-fur" cx="89" cy="30" r="13"/><circle class="hm-ear" cx="31" cy="31" r="6.5"/><circle class="hm-ear" cx="89" cy="31" r="6.5"/><ellipse class="hm-fur" cx="60" cy="64" rx="47" ry="41"/><ellipse class="hm-cream" cx="60" cy="76" rx="31" ry="25"/><ellipse class="hm-cheek" cx="32" cy="73" rx="7.5" ry="4.6"/><ellipse class="hm-cheek" cx="88" cy="73" rx="7.5" ry="4.6"/>${eyes[m]}<ellipse class="hm-ink" cx="60" cy="70" rx="3" ry="2.2"/>${mouth[m]}<ellipse class="hm-fur" cx="47" cy="96" rx="7" ry="5"/><ellipse class="hm-fur" cx="73" cy="96" rx="7" ry="5"/>${extra[m]}</svg>`;
}
function mascotEl(mood, cls="mascot"){ const d=h("div",{class:cls}); d.innerHTML=hamster(mood); return d; }

/* ---------- state & storage ---------- */
const LS="mongsil-coach-v1";
function blank(){ return {v:1,tasks:[],minutes:{},mistakes:[],points:0,activeDays:[],counts:{pomo:0,review:0,coach:0,task:0},badges:[],hasExamples:false,timerCfg:{focus:25,brk:5}}; }
function normalize(s){ const b=blank(); s=s&&typeof s==="object"?s:{}; return {...b,...s,counts:{...b.counts,...(s.counts||{})},timerCfg:{...b.timerCfg,...(s.timerCfg||{})}}; }
function seed(s){
  const t=today();
  s.tasks.push(
    {id:uid(),text:"수학 교과서 52~54쪽 일차방정식 문제 풀기",subj:"math",date:t,done:false,ex:true},
    {id:uid(),text:"영어 단어 20개 외우기 (Lesson 3)",subj:"eng",date:t,done:true,ex:true},
    {id:uid(),text:"과학 '물질의 상태 변화' 개념 정리",subj:"sci",date:t,done:false,ex:true});
  s.mistakes.push({id:uid(),subj:"math",q:"2x + 3 = 11 을 풀어라.",mine:"x = 7",why:"3을 이항할 때 부호를 안 바꿨다. 이항하면 +3 → -3.",ans:"2x = 8, x = 4",created:t,next:t,stage:0,ex:true});
  s.hasExamples=true; return s;
}
let state; let firstRun=false;
try{ const raw=localStorage.getItem(LS); state = raw?normalize(JSON.parse(raw)):null; }catch{ state=null; }
if(!state){ state=seed(blank()); firstRun=true; }

/* ---------- 내 공부 공간 (서버 /api/data, 학생별 열쇠) ---------- */
const KEY_LS="mongsil-study-key";
const kGet=k=>{ try{ return localStorage.getItem(k)||""; }catch{ return ""; } };
const kSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch{} };
function newStudyKey(){
  const A="abcdefghjkmnpqrstuvwxyz23456789", b=new Uint8Array(16); crypto.getRandomValues(b);
  const s=[...b].map(x=>A[x%A.length]).join("");
  return `mong-${s.slice(0,4)}-${s.slice(4,8)}-${s.slice(8,12)}-${s.slice(12,16)}`;
}
let studyKey=kGet(KEY_LS);
let saveTimer=null, chain=Promise.resolve(), serverOn=false, lastSaved="", syncMsg="";
function setSync(txt){ const c=document.getElementById("chipSync"); if(c) c.textContent=txt; }
function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch{}
  if(!serverOn) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(pushState,1200);
}
function pushState(){
  const body=JSON.stringify({state}); if(body===lastSaved) return chain;
  chain=chain.then(async()=>{
    const r=await fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json","x-study-key":studyKey},body});
    if(!r.ok) throw 0; lastSaved=body; setSync("내 공부 공간에 저장됨");
  }).catch(()=>setSync("잠시 이 기기에만 저장됨"));
  return chain;
}
async function pullState(key){
  const r=await fetch("/api/data",{headers:{"x-study-key":key},cache:"no-store"});
  if(r.status===503) return {off:true};
  if(!r.ok) throw new Error("pull");
  return r.json();
}
async function connectStore(){
  if(!studyKey){ studyKey=newStudyKey(); kSet(KEY_LS,studyKey); }
  try{
    const j=await pullState(studyKey);
    if(j.off){ setSync("이 기기에 저장됨"); return; }
    serverOn=true;
    if(j.state && (Number(j.updatedAt)||0) >= (Number(state.updatedAt)||0) && !firstRun){ state=normalize(j.state); lastSaved=JSON.stringify({state}); try{localStorage.setItem(LS,JSON.stringify(state));}catch{} render(); }
    else if(j.state && firstRun){ state=normalize(j.state); lastSaved=JSON.stringify({state}); try{localStorage.setItem(LS,JSON.stringify(state));}catch{} render(); }
    else await pushState();
    setSync("내 공부 공간에 저장됨");
    if(tab==="stats") render();
  }catch{ setSync("이 기기에 저장됨"); }
}
// 트로피 탑 창 아래: 내 공부 열쇠 보기·복사, 다른 기기에서 이어하기
function syncPanel(){
  const p=h("section",{class:"panel"});
  p.append(h("h2",null,"내 공부 열쇠"));
  if(!serverOn){ p.append(h("p",{class:"small muted"},"지금은 기록이 이 기기에만 저장되고 있어요.")); return p; }
  const keyBox=h("code",{class:"keybox tnum",id:"myKey"},"••••-••••-••••-••••");
  let shown=false;
  p.append(h("p",{class:"small muted"},"내 계획·타이머·오답·XP는 이 열쇠로 서버의 내 공간에 저장돼요. 다른 사람은 볼 수 없어요. 다른 기기에서 이어 하려면 이 열쇠가 필요하니 공책에 적어 두고, 친구에게는 알려 주지 마세요."),
    h("div",{class:"row"},keyBox,
      h("button",{class:"btn sm ghost",onclick:e=>{ shown=!shown; keyBox.textContent=shown?studyKey:"••••-••••-••••-••••"; e.currentTarget.textContent=shown?"가리기":"보기"; }},"보기"),
      h("button",{class:"btn sm",onclick:async()=>{ try{ await navigator.clipboard.writeText(studyKey); toast("열쇠를 복사했어요"); }catch{ shown=true; keyBox.textContent=studyKey; const r=document.createRange(); r.selectNodeContents(keyBox); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("열쇠를 선택했어요. 복사해 주세요"); } }},"복사")));
  const inp=h("input",{type:"text",id:"otherKey",class:"grow",placeholder:"mong-xxxx-xxxx-xxxx-xxxx",autocomplete:"off",spellcheck:"false",maxlength:"30"});
  const go2=async()=>{
    const k=inp.value.trim().toLowerCase();
    if(!/^mong(-[a-z0-9]{4}){4}$/.test(k)){ syncMsg="열쇠 모양이 달라요. mong- 으로 시작하는 열쇠를 그대로 입력해 주세요."; render(); return; }
    try{
      const j=await pullState(k);
      if(!j.state){ syncMsg="그 열쇠로 저장된 기록이 없어요. 글자를 다시 확인해 주세요."; render(); return; }
      studyKey=k; kSet(KEY_LS,k); state=normalize(j.state); lastSaved=JSON.stringify({state});
      try{ localStorage.setItem(LS,JSON.stringify(state)); }catch{}
      syncMsg=""; toast("내 기록을 불러왔어요"); render();
    }catch{ syncMsg="지금은 불러올 수 없어요. 잠시 뒤에 다시 해 주세요."; render(); }
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.isComposing) go2(); });
  p.append(h("h3",null,"다른 기기에서 이어 하기"),
    h("p",{class:"small muted"},"다른 기기에서 만든 열쇠를 넣으면 그 기록을 이 기기로 불러와요. 지금 이 기기의 기록 대신 그 기록을 쓰게 돼요."),
    h("div",{class:"row"},inp,h("button",{class:"btn sm primary",onclick:go2},"불러오기")),
    syncMsg?h("p",{class:"small",style:"color:var(--danger)"},syncMsg):"",
    h("p",{class:"small muted"},"오답 사진은 용량이 커서 찍은 기기에만 저장돼요."));
  return p;
}

/* ---------- rewards ---------- */
const BADGES=[
  {id:"first",n:"첫 걸음",d:"처음으로 포인트를 얻었어요",ic:"1",ok:s=>s.points>0},
  {id:"streak3",n:"3일 연속",d:"3일 연속 공부했어요",ic:"3",ok:s=>streak(s)>=3},
  {id:"streak7",n:"일주일 개근",d:"7일 연속 공부했어요",ic:"7",ok:s=>streak(s)>=7},
  {id:"pomo10",n:"집중왕",d:"집중 타이머 10번 완주",ic:"집",ok:s=>s.counts.pomo>=10},
  {id:"task20",n:"계획 실천가",d:"할 일 20개 완료",ic:"실",ok:s=>s.counts.task>=20},
  {id:"review10",n:"오답 정복자",d:"오답 복습 10번",ic:"복",ok:s=>s.counts.review>=10},
  {id:"coach5",n:"질문왕",d:"AI 코치와 5번 공부",ic:"?",ok:s=>s.counts.coach>=5},
  {id:"p500",n:"500 포인트",d:"포인트 500 모으기",ic:"P",ok:s=>s.points>=500}];
function streak(s){
  const set=new Set(s.activeDays); let k=today(); if(!set.has(k)) k=addDays(k,-1);
  let n=0; while(set.has(k)){ n++; k=addDays(k,-1); } return n;
}
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=h("div",{class:"toast",role:"status"},msg); document.body.append(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600);
}
function reward(pts, countKey, msg){
  state.points+=pts; if(countKey) state.counts[countKey]=(state.counts[countKey]||0)+1;
  const t=today(); if(!state.activeDays.includes(t)) state.activeDays.push(t);
  state.activeDays=state.activeDays.slice(-120);
  const fresh=BADGES.filter(b=>!state.badges.includes(b.id)&&b.ok(state));
  fresh.forEach(b=>state.badges.push(b.id));
  save();
  try{ world?.celebrate(pts); }catch{}
  toast(fresh.length?`뱃지 획득: ${fresh.map(b=>b.n).join(", ")}!`:`+${pts} XP · ${msg}`);
}

/* ---------- header / coach cheer ---------- */
function dueMistakes(){ const t=today(); return state.mistakes.filter(m=>m.next<=t); }
function cheer(){
  const t=today(), tt=state.tasks.filter(x=>x.date===t), done=tt.filter(x=>x.done).length;
  const min=Object.values(state.minutes[t]||{}).reduce((a,b)=>a+b,0);
  const st=streak(state), due=dueMistakes().length, hr=new Date().getHours();
  if(tt.length && done===tt.length) return {m:"happy",a:"오늘 계획 전부 끝! 정말 대단해.",b:"남은 시간엔 오답 복습이나 내일 계획을 세워 볼까?"};
  if(min>=50) return {m:"happy",a:`오늘 벌써 ${min}분 집중했어!`,b:"쉬는 시간도 꼭 챙기자. 물 한 잔 마시고 와."};
  if(due>0) return {m:"think",a:`오늘 다시 볼 오답이 ${due}개 있어.`,b:"잊어버리기 직전에 복습하면 오래 기억나."};
  if(st===0 && state.activeDays.length>0) return {m:"sad",a:"보고 싶었어! 오늘 다시 시작해 볼까?",b:"딱 25분만 같이 집중해 보자."};
  if(st>=2) return {m:"happy",a:`${st}일 연속 공부 중!`,b:"오늘도 이어 가면 기록이 더 길어져."};
  if(!tt.length) return {m:"normal",a:hr<12?"좋은 아침! 오늘 할 일을 정해 볼까?":"오늘 할 일을 하나만 적어 볼까?",b:"작게 정할수록 끝내기 쉬워."};
  return {m:"normal",a:`오늘 할 일 ${tt.length}개 중 ${done}개 끝냈어.`,b:"하나씩 차근차근 해 보자."};
}
function renderHeader(){
  const c=cheer();
  document.getElementById("heroMascot").innerHTML=hamster(timer.running&&timer.phase==="focus"?"focus":c.m);
  document.getElementById("heroLine").textContent=c.a;
  document.getElementById("heroSub").textContent=c.b;
  document.getElementById("chipStreak").textContent=`연속 ${streak(state)}일`;
  const lv=1+Math.floor(state.points/100);
  document.getElementById("lvNum").textContent=`Lv.${lv}`;
  document.getElementById("xpBar").style.width=`${state.points%100}%`;
  document.getElementById("chipPoints").textContent=`${state.points%100}/100 XP`;
  const due=dueMistakes().length, tb=document.getElementById("tab-review");
  tb.querySelector(".dot")?.remove(); if(due) tb.append(h("span",{class:"dot tnum"},due));
}

/* ---------- router ---------- */
const TABS=["home","plan","timer","coach","review","stats"];
let tab = TABS.includes(location.hash.slice(1))?location.hash.slice(1):"home";
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>travel(b.dataset.tab)));
window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(TABS.includes(t)&&t!==tab){ tab=t; render(); }});
function go(t){ const was=tab; tab=t; if(location.hash.slice(1)!==t){ try{ history.replaceState(null,"","#"+t); }catch{ location.hash=t; } } render();
  if(t!=="home"&&was==="home") setTimeout(()=>document.querySelector(".gwin-bar button")?.focus({preventScroll:true}),0); }
// 게임처럼: 섬에 있을 때 건물 버튼을 누르면 몽실이가 걸어가서 문을 연다
function travel(t){ if(t==="home"||!world||tab!=="home"){ go(t); return; } world.walkToPlace(t); }
const view=document.getElementById("view");
view.addEventListener("click",e=>{ if(e.target===view&&tab!=="home") go("home"); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&tab!=="home"&&!coach?.busy) go("home"); });
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  renderHeader();
  const body=({home:vHome,plan:vPlan,timer:vTimer,coach:vCoach,review:vReview,stats:vStats})[tab]();
  if(tab==="home"){ view.className="layer quest"; view.removeAttribute("role"); view.replaceChildren(body); }
  else{
    const P=PLACES.find(p=>p.tab===tab);
    view.className="layer win";
    view.replaceChildren(h("div",{class:"gwin",role:"dialog","aria-modal":"true","aria-labelledby":"gwTitle"},
      h("div",{class:"gwin-bar"},h("h2",{id:"gwTitle"},P?P.n:""),h("button",{onclick:()=>go("home"),"aria-label":"창 닫고 섬으로 돌아가기"},"섬으로 ✕")),
      h("div",{class:"gwin-body"},body)));
  }
  world?.refreshBadges();
}

function exampleBanner(){
  if(!state.hasExamples) return null;
  return h("div",{class:"banner"},
    h("span",{class:"grow"},"처음이라 예시 할 일과 오답을 넣어 두었어요. 둘러본 뒤 지워도 돼요."),
    h("button",{class:"btn sm ghost",onclick:()=>{ state.tasks=state.tasks.filter(x=>!x.ex); state.mistakes=state.mistakes.filter(x=>!x.ex); state.hasExamples=false; save(); render(); toast("예시를 지웠어요"); }},"예시 지우기"));
}

/* ---------- 3D STUDY ISLAND (Three.js + Higgsfield-made hamster GLB) ---------- */
let worldEl=null, world=null;
const PLACES=[
  {tab:"plan",  n:"계획 게시판", a:-90},
  {tab:"timer", n:"집중 시계탑", a:-18},
  {tab:"coach", n:"질문 도서관", a:54},
  {tab:"review",n:"오답 동굴",   a:126},
  {tab:"stats", n:"트로피 탑",   a:198}];
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#88c"; }
function getWorld(){
  if(worldEl) { world?.refreshBadges(); return worldEl; }
  worldEl=h("div",{class:"world",role:"application","aria-label":"3D 공부 섬. 건물을 누르면 몽실이가 걸어가서 그 기능을 열어요."});
  if(!window.THREE){ worldEl.append(h("div",{class:"wload"},"3D 섬을 불러오지 못했어요. 아래 메뉴를 써 주세요.")); return worldEl; }
  try{ world=buildWorld(worldEl); }catch(e){ worldEl.replaceChildren(h("div",{class:"wload"},"이 기기에서는 3D 섬을 보여 줄 수 없어요.")); world=null; }
  return worldEl;
}
function buildWorld(host){
  const T=THREE;
  if(T.ColorManagement) T.ColorManagement.legacyMode=false; // 색을 sRGB로 해석해서 바닥·건물 색이 하얗게 바래지 않게
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  renderer.outputEncoding=T.sRGBEncoding; renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
  host.append(renderer.domElement);
  const loading=h("div",{class:"wload"},"몽실이가 섬에 오는 중…"); host.append(loading);
  const scene=new T.Scene();
  const cam=new T.PerspectiveCamera(42,1.6,1,140);
  scene.add(new T.HemisphereLight(0xffffff,0x8fb39a,0.85));
  const sun=new T.DirectionalLight(0xffffff,0.9); sun.position.set(8,14,6); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40}); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03; scene.add(sun);
  const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.85,metalness:0});
  let clockHand=null, hop=0;
  // sea + island
  const sea=new T.Mesh(new T.CircleGeometry(60,48),new T.MeshStandardMaterial({color:cssVar("--sea"),roughness:.4,transparent:true,opacity:.9}));
  sea.rotation.x=-Math.PI/2; sea.position.y=-0.6; scene.add(sea);
  const sand=new T.Mesh(new T.CylinderGeometry(10.6,11.4,0.9,48),mat(0xF3DDAA)); sand.position.y=-0.52; sand.receiveShadow=true; scene.add(sand);
  const grass=new T.Mesh(new T.CylinderGeometry(9.6,10,0.4,48),mat(0x9BD67E)); grass.position.y=-0.2; grass.receiveShadow=true; scene.add(grass);
  const ground=grass; // raycast target
  // path ring
  const ringMat=mat(0xEAD7A8); Object.assign(ringMat,{polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}); const ring=new T.Mesh(new T.RingGeometry(5.2,6.2,64),ringMat); ring.rotation.x=-Math.PI/2; ring.position.y=0.04; ring.receiveShadow=true; scene.add(ring);
  const add=(geo,m,x,y,z,parent=scene)=>{ const o=new T.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; parent.add(o); return o; };
  // buildings
  const builders={
    plan(g){ add(new T.BoxGeometry(.18,1.6,.18),mat(0x9C6B3E),-.8,.8,0,g); add(new T.BoxGeometry(.18,1.6,.18),mat(0x9C6B3E),.8,.8,0,g);
      add(new T.BoxGeometry(2,1.1,.12),mat(0xC98F55),0,1.35,0,g); add(new T.BoxGeometry(1.7,.85,.02),mat(0xFFF8E8),0,1.35,.07,g);
      [[-.45,1.55,0xFF9DA7],[.1,1.45,0x8EC8FF],[.5,1.2,0xFFE08A]].forEach(([x,y,c])=>add(new T.BoxGeometry(.38,.32,.02),mat(c),x,y,.09,g)); },
    timer(g){ add(new T.BoxGeometry(1.3,2.8,1.3),mat(0xF6E7D2),0,1.4,0,g); add(new T.ConeGeometry(1.1,1.1,4),mat(0xF27C4A),0,3.35,0,g).rotation.y=Math.PI/4;
      const face=add(new T.CylinderGeometry(.48,.48,.08,32),mat(0xffffff),0,2.15,.68,g); face.rotation.x=Math.PI/2;
      add(new T.BoxGeometry(.06,.36,.04),mat(0x333344),0,2.3,.74,g); const pivot=new T.Group(); pivot.position.set(0,2.15,.75); g.add(pivot); add(new T.BoxGeometry(.05,.34,.04),mat(0xF27C4A),0,.15,0,pivot); clockHand=pivot;
      add(new T.BoxGeometry(.5,.8,.06),mat(0x9C6B3E),0,.4,.66,g); },
    coach(g){ add(new T.BoxGeometry(2.4,1.6,1.6),mat(0xDCE8FF),0,.8,0,g);
      const roof=add(new T.CylinderGeometry(1.15,1.15,2.6,3),mat(0x5B8DEF),0,2.05,0,g); roof.rotation.z=Math.PI/2; roof.scale.set(1,1,.9);
      [-0.8,-0.27,0.27,0.8].forEach(x=>add(new T.CylinderGeometry(.09,.09,1.5,10),mat(0xffffff),x,.75,.86,g));
      add(new T.BoxGeometry(.5,.9,.06),mat(0x9C6B3E),0,.45,.82,g); },
    review(g){ const rock=add(new T.SphereGeometry(1.5,20,14,0,Math.PI*2,0,Math.PI/2),mat(0x9AA3B5),0,0,0,g); rock.scale.set(1.15,1,1);
      const hole=add(new T.CircleGeometry(.62,24),new T.MeshBasicMaterial({color:0x2A2D3A}),0,.55,1.38,g); hole.rotation.x=-.25;
      add(new T.SphereGeometry(.35,10,8),mat(0xB7BFD0),1.3,.15,.6,g); add(new T.SphereGeometry(.25,10,8),mat(0xB7BFD0),-1.4,.1,.5,g); },
    stats(g){ add(new T.CylinderGeometry(.75,.9,1.2,24),mat(0xE8E1F7),0,.6,0,g); add(new T.CylinderGeometry(.55,.65,.9,24),mat(0xD9CDF3),0,1.65,0,g);
      const gold=new T.MeshStandardMaterial({color:0xF5C042,roughness:.3,metalness:.6});
      add(new T.CylinderGeometry(.42,.18,.55,24),gold,0,2.45,0,g); add(new T.CylinderGeometry(.06,.06,.25,10),gold,0,2.05,0,g); add(new T.CylinderGeometry(.22,.22,.08,20),gold,0,1.95,0,g);
      [-1,1].forEach(s=>{ const hd=add(new T.TorusGeometry(.17,.04,8,16,Math.PI),gold,s*.44,2.5,0,g); hd.rotation.z=s>0?-Math.PI/2:Math.PI/2; }); }
  };
  const R=7.6, picks=[];
  PLACES.forEach(p=>{
    const g=new T.Group(); const r=p.a*Math.PI/180; g.position.set(Math.cos(r)*R,0,Math.sin(r)*R);
    g.lookAt(0,0,0); builders[p.tab](g); scene.add(g);
    g.traverse(o=>{ if(o.isMesh){ o.userData.place=p; picks.push(o); } });
    p.group=g; p.door=new T.Vector3(Math.cos(r)*(R-1.9),0,Math.sin(r)*(R-1.9));
    p.label=h("button",{class:"wlabel",onclick:e=>{ e.stopPropagation(); walkTo(p.door,p); }},p.n); host.append(p.label);
  });
  // trees & flowers
  const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);
  for(let i=0;i<16;i++){
    const a=rnd()*Math.PI*2, d=2.2+rnd()*1.8+(i%2?6.3:0); if(d>9.2) continue;
    const near=PLACES.some(p=>Math.abs(((p.a*Math.PI/180-a+Math.PI*3)%(Math.PI*2))-Math.PI)<.35); if(d>6&&near) continue;
    const x=Math.cos(a)*d, z=Math.sin(a)*d, s=.7+rnd()*.5;
    add(new T.CylinderGeometry(.1*s,.14*s,.6*s,8),mat(0x9C6B3E),x,.3*s,z);
    add(new T.SphereGeometry(.55*s,12,10),mat(i%3?0x6FBF73:0x88CC7A),x,.95*s,z);
  }
  for(let i=0;i<26;i++){ const a=rnd()*Math.PI*2, d=1.5+rnd()*7.5; add(new T.SphereGeometry(.07,6,5),mat([0xFF9DA7,0xFFE08A,0xffffff,0xC6A8FF][i%4]),Math.cos(a)*d,.06,Math.sin(a)*d); }
  // clouds
  const clouds=new T.Group(); scene.add(clouds);
  for(let i=0;i<5;i++){ const c=new T.Group(); [[0,0,0,.9],[.8,-.1,.1,.7],[-.8,-.15,0,.65]].forEach(([x,y,z,r])=>add(new T.SphereGeometry(r,12,10),new T.MeshStandardMaterial({color:0xffffff,roughness:1}),x,y,z,c));
    c.position.set(Math.cos(i*1.3)*16,6+i%2,Math.sin(i*1.3)*16); c.traverse(o=>o.castShadow=false); clouds.add(c); }
  // hamster (Higgsfield GLB, fallback = simple shapes)
  const player=new T.Group(); scene.add(player); player.position.set(0,0,2);
  let mixer=null, walkAction=null;
  function fallbackHamster(){
    const g=new T.Group(); const fur=mat(0xF7B27A), cream=mat(0xFFF4E6);
    add(new T.SphereGeometry(.55,24,18),fur,0,.6,0,g).scale.set(1,1.05,.92);
    add(new T.SphereGeometry(.4,20,16),cream,0,.5,.2,g).scale.set(1,1.1,.8);
    [-1,1].forEach(s=>{ add(new T.SphereGeometry(.15,12,10),fur,s*.33,1.12,0,g); add(new T.SphereGeometry(.05,8,6),mat(0x272A40),s*.17,.8,.46,g); add(new T.SphereGeometry(.09,10,8),mat(0xFF9DA7),s*.32,.68,.4,g); });
    add(new T.TorusGeometry(.5,.07,8,28),mat(0x2FA88A),0,1.0,0,g).rotation.x=Math.PI/2;
    return g;
  }
  // 리깅된 모델은 메시 상자가 뼈 변형을 반영하지 않으므로 뼈 위치로 크기를 잰다
  function measure(obj){
    obj.updateMatrixWorld(true);
    const bones=[]; obj.traverse(o=>{ if(o.isBone) bones.push(o); });
    if(bones.length>2){ const b=new T.Box3(); const v=new T.Vector3(); bones.forEach(o=>b.expandByPoint(o.getWorldPosition(v))); const sz=b.getSize(new T.Vector3());
      return {minY:b.min.y-sz.y*.06, h:sz.y*1.22, c:b.getCenter(new T.Vector3())}; }
    const b=new T.Box3().setFromObject(obj); return {minY:b.min.y, h:b.getSize(new T.Vector3()).y, c:b.getCenter(new T.Vector3())};
  }
  function placeModel(obj){
    const m1=measure(obj); obj.scale.multiplyScalar(1.9/(m1.h||1));
    const m2=measure(obj); obj.position.y-=m2.minY; obj.position.x-=m2.c.x; obj.position.z-=m2.c.z;
    obj.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.frustumCulled=false; } });
    player.add(obj);
  }
  const done=()=>loading.remove();
  const onModel=gltf=>{
    placeModel(gltf.scene);
    if(gltf.animations?.length){ mixer=new T.AnimationMixer(gltf.scene); walkAction=mixer.clipAction(gltf.animations[0]); walkAction.play(); walkAction.paused=true; }
    done();
  };
  const noModel=()=>{ placeModel(fallbackHamster()); done(); };
  if(T.GLTFLoader){
    const loader=new T.GLTFLoader();
    // 게시 페이지는 GLB를 JSON(base64)으로 싣고, 일반 웹 서버는 mongsil.glb를 그대로 쓴다
    fetch("mongsil-glb.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(j=>{
      const bin=atob(j.b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      loader.parse(u.buffer,"",onModel,noModel);
    }).catch(()=>loader.load("mongsil.glb",onModel,undefined,noModel));
  } else noModel();
  // movement
  let target=null, pending=null, nearPlace=null; const keys={};
  const tmp=new T.Vector3();
  function walkTo(v,place){ target=v.clone(); target.y=0; pending=place||null; }
  const ray=new T.Raycaster(), ndc=new T.Vector2();
  renderer.domElement.addEventListener("pointerdown",e=>{
    const r=renderer.domElement.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,cam);
    const hitB=ray.intersectObjects(picks,false)[0]; if(hitB){ const p=hitB.object.userData.place; walkTo(p.door,p); return; }
    const hitG=ray.intersectObject(ground,false)[0]; if(hitG){ const pt=hitG.point; if(Math.hypot(pt.x,pt.z)<9.2) walkTo(pt,null); }
  });
  const kd=e=>{ if(tab!=="home"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) return;
    const k=e.key.toLowerCase(); if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){ keys[k]=e.type==="keydown"; if(e.type==="keydown"){ e.preventDefault(); target=null; pending=null; } }
    if(e.type==="keydown"&&(k==="enter"||k===" ")&&nearPlace){ e.preventDefault(); go(nearPlace.tab); } };
  window.addEventListener("keydown",kd); window.addEventListener("keyup",kd);
  // hud
  const tip=h("span",{class:"tip"},"건물을 누르거나 땅을 눌러 몽실이를 움직여 보세요 (키보드: 방향키·WASD)");
  const enterBtn=h("button",{class:"btn sm primary enter",hidden:true,onclick:()=>nearPlace&&go(nearPlace.tab)},"들어가기");
  host.append(h("div",{class:"whud"},tip,enterBtn));
  function refreshBadges(){
    const t=today(), tt=state.tasks.filter(x=>x.date===t), left=tt.filter(x=>!x.done).length, due=dueMistakes().length;
    const counts={plan:left,review:due};
    PLACES.forEach(p=>{ p.label.textContent=p.n; if(counts[p.tab]) p.label.append(h("span",{class:"dot tnum"},counts[p.tab])); });
    sea.material.color.set(cssVar("--sea"));
  }
  refreshBadges();
  // loop
  const clock=new T.Clock(); let raf=0, camPos=new T.Vector3(0,15.5,19);
  function resize(){ const w=host.clientWidth, hh=host.clientHeight; if(!w||!hh) return; renderer.setSize(w,hh,false); cam.aspect=w/hh; cam.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(host);
  function frame(){
    raf=requestAnimationFrame(frame);
    if(!host.isConnected){ return; }
    const dt=Math.min(.05,clock.getDelta()), speed=3.2;
    let mv=new T.Vector3();
    if(keys.arrowup||keys.w) mv.z-=1; if(keys.arrowdown||keys.s) mv.z+=1; if(keys.arrowleft||keys.a) mv.x-=1; if(keys.arrowright||keys.d) mv.x+=1;
    if(mv.lengthSq()) mv.normalize();
    else if(target){ tmp.subVectors(target,player.position); tmp.y=0; const d=tmp.length();
      if(d<.12){ target=null; if(pending){ const p=pending; pending=null; setTimeout(()=>go(p.tab),250); } } else mv.copy(tmp.normalize()); }
    const moving=mv.lengthSq()>0;
    if(moving){
      const next=player.position.clone().addScaledVector(mv,speed*dt);
      if(Math.hypot(next.x,next.z)>9.2) next.setLength(9.2).setY(0);
      player.position.copy(next);
      const want=Math.atan2(mv.x,mv.z); let diff=want-player.rotation.y; diff=Math.atan2(Math.sin(diff),Math.cos(diff)); player.rotation.y+=diff*Math.min(1,dt*10);
    }
    if(walkAction){ walkAction.paused=!moving; if(!moving) walkAction.time=0; }
    if(mixer) mixer.update(dt);
    if(!walkAction) player.children[0]&&(player.children[0].position.y=moving?Math.abs(Math.sin(clock.elapsedTime*12))*.08:0);
    // nearest place
    let best=null, bd=1.6; PLACES.forEach(p=>{ const d=player.position.distanceTo(p.door); if(d<bd){ bd=d; best=p; } });
    if(best!==nearPlace){ nearPlace=best; PLACES.forEach(p=>p.label.classList.toggle("near",p===best)); enterBtn.hidden=!best; enterBtn.textContent=best?`${best.n} 들어가기`:""; }
    clouds.rotation.y+=dt*.02;
    if(clockHand) clockHand.rotation.z = (timer.running||timer.startedAt) ? -(1-timer.left/tLen(timer.phase))*Math.PI*2 : clockHand.rotation.z-dt*.15;
    if(hop>0){ hop=Math.max(0,hop-dt*1.7); player.position.y=Math.sin((1-hop)*Math.PI)*.9; } else player.position.y=0;
    // camera follow
    const far=cam.aspect<1?1.6:1.18;
    const want=new T.Vector3(player.position.x*.35,15.5*far,player.position.z*.35+17*far); camPos.lerp(want,Math.min(1,dt*2.5)); cam.position.copy(camPos);
    cam.lookAt(player.position.x*.4,0,player.position.z*.4+.8);
    renderer.render(scene,cam);
    // labels
    const w=host.clientWidth, hh=host.clientHeight;
    PLACES.forEach(p=>{ const v=p.group.position.clone(); v.y=p.tab==="timer"?4.3:p.tab==="stats"?3.2:2.9; v.project(cam);
      const vis=v.z<1; p.label.style.display=vis?"":"none"; p.label.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*hh}px) translate(-50%,-100%)`; });
  }
  function celebrate(pts){
    hop=1;
    const v=player.position.clone(); v.y=2.4; v.project(cam);
    const r=host.getBoundingClientRect();
    const el=h("div",{class:"float-xp","aria-hidden":"true"},`+${pts} XP`);
    el.style.left=`${r.left+(v.x*.5+.5)*r.width}px`; el.style.top=`${r.top+(-v.y*.5+.5)*r.height}px`;
    document.body.append(el); setTimeout(()=>el.remove(),1400);
  }
  function walkToPlace(t){ const p=PLACES.find(x=>x.tab===t); if(p) walkTo(p.door,p); else go(t); }
  resize(); frame();
  return {refreshBadges,celebrate,walkToPlace};
}

/* ---------- HOME ---------- */
function vHome(){
  const t=today(), tt=state.tasks.filter(x=>x.date===t), due=dueMistakes().length;
  const done=tt.filter(x=>x.done).length;
  const min=Object.values(state.minutes[t]||{}).reduce((a,b)=>a+b,0);
  const open=questOpen;
  const p=h("section",{class:"panel"});
  p.append(h("button",{class:"qhead","aria-expanded":String(open),onclick:()=>{questOpen=!questOpen;render();}},
    h("h3",null,"오늘의 퀘스트"),h("span",{class:"chip tnum"},`${done}/${tt.length}`),h("span",{class:"small muted"},open?"접기":"펼치기")));
  if(open){
    if(tt.length){ const list=h("ul",{class:"list"}); tt.slice(0,4).forEach(x=>list.append(taskItem(x))); p.append(list);
      if(tt.length>4) p.append(h("p",{class:"small muted"},`외 ${tt.length-4}개는 계획 게시판에서 볼 수 있어요`)); }

const timer={phase:"focus",running:false,end:0,left:0,subj:"math",round:0,iv:null,startedAt:0,wake:null};
function tLen(ph){ return (ph==="focus"?state.timerCfg.focus:state.timerCfg.brk)*60; }
timer.left=tLen("focus");
function beep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.15,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2); o.connect(g).connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+.22); }); }catch{}
}
function logMinutes(min){
  if(min<1) return; const t=today(); state.minutes[t]=state.minutes[t]||{};
  state.minutes[t][timer.subj]=(state.minutes[t][timer.subj]||0)+min;
  const cut=addDays(t,-90); for(const k of Object.keys(state.minutes)) if(k<cut) delete state.minutes[k];
}
function tick(){
  timer.left=Math.max(0,Math.round((timer.end-Date.now())/1000));
  updateTimerUI();
  if(timer.left<=0) finishPhase();
}
function startTimer(){
  timer.running=true; timer.end=Date.now()+timer.left*1000; if(timer.phase==="focus"&&!timer.startedAt) timer.startedAt=Date.now();

  try{ navigator.wakeLock?.request("screen").then(l=>timer.wake=l).catch(()=>{}); }catch{}
  render();
}
function pauseTimer(){ timer.running=false; clearInterval(timer.iv); try{timer.wake?.release();}catch{} render(); }
function resetTimer(logPartial){
  if(logPartial && timer.phase==="focus"){ const used=tLen("focus")-timer.left; const min=Math.floor(used/60); if(min>=1){ logMinutes(min); save(); toast(`${min}분 기록했어요`); } }
  timer.running=false; clearInterval(timer.iv); timer.left=tLen(timer.phase); timer.startedAt=0; try{timer.wake?.release();}catch{} render();
}
function finishPhase(){
  clearInterval(timer.iv); timer.running=false; beep();
  if(timer.phase==="focus"){
    logMinutes(state.timerCfg.focus); timer.round=(timer.round%4)+1;
    reward(20,"pomo",`${subjName(timer.subj)} ${state.timerCfg.focus}분 집중 완료`);

  } else { timer.phase="focus"; toast("쉬는 시간 끝! 다시 집중해 볼까?"); }

}
function updateTimerUI(){

  const arc=document.getElementById("tArc"); const C=2*Math.PI*52;

}

async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return {mime:"image/jpeg",data:c.toDataURL("image/jpeg",0.82).split(",")[1]};
  } finally { URL.revokeObjectURL(url); }
}
async function ask(userText, shown){

  coach.busy=true; coach.err=""; coach.ctl=new AbortController(); render();
  let turns=coach.turns; if(turns.length>30) turns=[turns[0],...turns.slice(-28)];
  while(turns.length && turns[0].role!=="user") turns=turns.slice(1);
  try{
    const r=await fetch(API,{method:"POST",signal:coach.ctl.signal,
      headers:{"Content-Type":"application/json","x-device-id":deviceId,"x-class-code":classCode},
      body:JSON.stringify({turns, image:coach.photo||undefined})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.text){
      if(j.error==="wrong_code"){ classCode=""; lsSet("mongsil-class-code",""); }
      if(typeof j.remaining==="number") coach.remaining=j.remaining;
      throw {code:j.error||"upstream_error",message:j.message};
    }
    bubble.text=j.text; bubble.pending=false; coach.turns.push({role:"assistant",content:j.text});
    if(typeof j.remaining==="number") coach.remaining=j.remaining;
  }catch(e){
    coach.turns.pop(); coach.view=coach.view.filter(v=>v!==bubble);

}

    h("div",{class:"compose"},ta,h("button",{class:"btn primary",disabled:coach.busy,onclick:send},"보내기")),

const PhotoDB={
  open(){ if(this.p) return this.p; this.p=new Promise((ok,no)=>{ try{ const r=indexedDB.open("mongsil-photos",1); r.onupgradeneeded=()=>r.result.createObjectStore("p"); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } }); return this.p; },
  async put(k,blob){ const d=await this.open(); return new Promise((ok,no)=>{ const t=d.transaction("p","readwrite"); t.objectStore("p").put(blob,k); t.oncomplete=()=>ok(); t.onerror=()=>no(t.error); }); },
  async get(k){ const d=await this.open(); return new Promise(ok=>{ const r=d.transaction("p").objectStore("p").get(k); r.onsuccess=()=>ok(r.result||null); r.onerror=()=>ok(null); }); },
  async del(k){ try{ const d=await this.open(); d.transaction("p","readwrite").objectStore("p").delete(k); }catch{} }
};
const photoUrls=new Map();
async function photoUrl(id){
  if(photoUrls.has(id)) return photoUrls.get(id);
  const b=await PhotoDB.get(id).catch(()=>null); const u=b?URL.createObjectURL(b):null; photoUrls.set(id,u); return u;
}
async function shrinkImage(file,max=1400,q=.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url; });
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("blob")),"image/jpeg",q));
  } finally { URL.revokeObjectURL(url); }
}
function openMistakeForm(pre){ mForm={subj:pre?.subj||"math",q:pre?.q||"",mine:"",why:"",ans:"",photo:null,preview:"",ocr:"idle",ocrMsg:""}; go("review"); }

async function pickMistakePhoto(file){

  try{ f.photo=await shrinkImage(file); }catch{ f.ocrMsg="이 사진은 열 수 없어요. JPG나 PNG로 다시 골라 주세요."; render(); return; }
  if(f.preview) URL.revokeObjectURL(f.preview); f.preview=URL.createObjectURL(f.photo); f.ocrMsg="";

}

function vStats(){

  else{
    const W=560,H=220,L=40,B=30,T=16,plotH=H-B-T, max=Math.max(30,Math.ceil(Math.max(...per)/30)*30);

      const x=L+i*bw+bw*0.2, w=bw*0.6; let y=T+plotH;

      s+=`<text x="${x+w/2}" y="${H-10}" text-anchor="middle" font-size="12" fill="${k===t?"var(--accent)":"var(--ink-soft)"}" font-weight="${k===t?700:400}">${wd} ${dd}</text>`;

    Object.entries(bySub).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>list.append(h("div",{class:"hbar"},h("span",null,subjName(k)),h("span",{class:"track"},h("span",{style:`width:${v/top*100}%;background:${subjColor(k)}`})),h("span",{class:"tnum muted",style:"text-align:right"},`${v}분`))));
    p.append(h("h3",null,"과목별"),list);

  b.append(g,
    h("div",{class:"cards"},
      h("div",{class:"stat"},h("span",{class:"n tnum"},state.counts.pomo),h("span",{class:"l"},"타이머 완주")),
      h("div",{class:"stat"},h("span",{class:"n tnum"},state.counts.task),h("span",{class:"l"},"완료한 할 일")),

  wrap.append(p,b,syncPanel()||""); return wrap;
